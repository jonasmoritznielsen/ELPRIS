<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="[apple-touch-icon.png](apple-touch-icon.png)">
<link rel="apple-touch-icon" href="[apple-touch-icon.png](apple-touch-icon.png)">
<title>Moritz Elpris</title>
<style>
* {
box-sizing: border-box;
}
html,
body {
margin: 0;
padding: 0;
width: 100%;
min-height: 100%;
background: #07111f;
}
body {
color: #f8fafc;
font-family:
-apple-system,
BlinkMacSystemFont,
"SF Pro Display",
"Segoe UI",
sans-serif;
}
.app {
width: 100%;
max-width: 480px;
margin: 0 auto;
padding-top: calc(env(safe-area-inset-top) + 12px);
padding-left: 16px;
padding-right: 16px;
padding-bottom: calc(env(safe-area-inset-bottom) + 24px);
display: flex;
flex-direction: column;
min-height: 100vh;
}
/* =========================================================
   HEADER
   ========================================================= */
header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 18px;
}
.logo {
font-size: 17px;
font-weight: 800;
letter-spacing: -0.35px;
white-space: nowrap;
}
.logo .bolt {
color: #38e6a0;
font-size: 20px;
margin-right: 3px;
}
.logo .price {
font-weight: 750;
color: #ffffff;
}
.area {
margin-top: 3px;
font-size: 11px;
color: #8392a8;
white-space: nowrap;
}
/* =========================================================
   DATA TIMESTAMP
   ========================================================= */
.data-status {
font-size: 11px;
color: #8392a8;
white-space: nowrap;
}
.data-symbol {
font-weight: 800;
font-size: 14px;
display: inline-block;
margin-left: 2px;
margin-right: 2px;
color: #8392a8;
}
.data-timestamp {
font-variant-numeric: tabular-nums;
}
.data-symbol.data-ok {
color: #38e6a0;
animation: dataPulseGreen 1.8s ease-in-out infinite;
}
.data-symbol.data-error {
color: #ff4d4d;
animation: dataPulseRed 1.8s ease-in-out infinite;
}
@keyframes dataPulseGreen {
0% {
opacity: .45;
text-shadow:
0 0 0 rgba(56,230,160,0);
}
50% {
opacity: 1;
text-shadow:
0 0 8px rgba(56,230,160,.75);
}
100% {
opacity: .45;
text-shadow:
0 0 0 rgba(56,230,160,0);
}
}
@keyframes dataPulseRed {
0% {
opacity: .45;
text-shadow:
0 0 0 rgba(255,77,77,0);
}
50% {
opacity: 1;
text-shadow:
0 0 8px rgba(255,77,77,.75);
}
100% {
opacity: .45;
text-shadow:
0 0 0 rgba(255,77,77,0);
}
}
.header-right {
display: flex;
align-items: center;
gap: 8px;
margin-left: 10px;
}
.status {
padding: 8px 11px;
border-radius: 20px;
background: #132238;
border: 1px solid #233651;
color: #ffffff;
font-size: 11px;
font-weight: 700;
white-space: nowrap;
cursor: pointer;
font-family: inherit;
}
/* =========================================================
   DAGS VÆLGER
   ========================================================= */
.days {
display: flex;
gap: 5px;
margin-top: 14px;
padding: 4px;
background: #101d30;
border: 1px solid #20314a;
border-radius: 15px;
}
.day {
flex: 1;
padding: 10px;
border: 0;
border-radius: 11px;
background: transparent;
color: #8493a9;
font-weight: 700;
font-size: 13px;
cursor: pointer;
}
.day.active {
background: #243852;
color: white;
}
.day-next {
flex: 0 0 42px;
transition: opacity .2s ease;
}
.day-next.disabled {
opacity: .25;
cursor: default;
}
/* =========================================================
   CARD
   ========================================================= */
.card {
margin-top: 14px;
padding: 17px;
background: #101c2e;
border: 1px solid #20314a;
border-radius: 22px;
}
.card-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 14px;
}
.card-title {
font-size: 15px;
font-weight: 750;
}
.card-title .forecast-text {
color: #ff4d4d;
animation: forecastPulse 3.2s ease-in-out infinite;
}
@keyframes forecastPulse {
0% {
filter: saturate(0.75);
}
50% {
filter: saturate(1.45);
}
100% {
filter: saturate(0.75);
}
}
.card-date {
color: #728198;
font-size: 11px;
}
/* =========================================================
   GRAF
   ========================================================= */
.chart {
position: relative;
width: 100%;
height: 220px;
overflow: visible;
touch-action: none;
}
.chart-line {
position: absolute;
left: 0;
right: 0;
height: 1px;
background: rgba(255,255,255,.16);
pointer-events: none;
z-index: 120;
}
.zero-line {
position: absolute;
left: 0;
right: 0;
height: 1px;
background: rgba(255,255,255,.42);
pointer-events: none;
z-index: 122;
}
/* =========================================================
   SØJLER
   ========================================================= */
.bar {
position: absolute;
width: calc(4.1666666667% - 3px);
margin: 0;
padding: 0;
border: 0;
border-radius: 4px;
cursor: pointer;
touch-action: none;
transition:
filter .15s ease,
opacity .15s ease,
box-shadow .15s ease;
z-index: 20;
}
.bar.blue {
background:
linear-gradient(
to top,
#2563eb,
#60a5fa
);
}
.bar.cheap {
background:
linear-gradient(
to top,
#059669,
#6ee7b7
);
}
.bar.warning {
background:
linear-gradient(
to top,
#d97706,
#fbbf24
);
}
.bar.expensive {
background:
linear-gradient(
to top,
#dc2626,
#fb7185
);
}
.bar.negative {
background:
linear-gradient(
to bottom,
#7c3aed,
#c084fc
);
}
.bar.passed {
opacity: .38;
}
/* =========================================================
   PROGNOSE
   ========================================================= */
.bar.forecast.blue {
background:
linear-gradient(
to top,
#315fa8,
#7196c8
);
}
.bar.forecast.cheap {
background:
linear-gradient(
to top,
#147a61,
#71bda6
);
}
.bar.forecast.warning {
background:
linear-gradient(
to top,
#a87522,
#c7a354
);
}
.bar.forecast.expensive {
background:
linear-gradient(
to top,
#a9434a,
#c56f78
);
}
.bar.forecast.negative {
background:
linear-gradient(
to bottom,
#62409b,
#9472c2
);
}
.bar.forecast::after {
content: "";
position: absolute;
left: 0;
right: 0;
top: 0;
bottom: 0;
border-radius: inherit;
pointer-events: none;
z-index: 50;
background:
repeating-linear-gradient(
135deg,
rgba(255,255,255,.18) 0px,
rgba(255,255,255,.18) 3px,
rgba(255,255,255,0) 3px,
rgba(255,255,255,0) 10px
);
}
.bar.forecast {
box-shadow:
inset 0 0 0 1px
rgba(255,255,255,.20);
}
.bar.current {
opacity: 1;
box-shadow:
inset 0 0 0 2px
rgba(255,255,255,.9),
0 0 10px
rgba(255,255,255,.25);
}
/* =========================================================
   VALGTE SØJLER
   ========================================================= */
.bar.four-hour-selected {
z-index: 90;
opacity: 1;
filter: brightness(1.08);
box-shadow:
inset 0 0 0 2px
rgba(255,255,255,.85),
0 0 12px
rgba(255,255,255,.22);
}
.bar.single-hour-selected {
z-index: 95;
opacity: 1;
filter: brightness(1.12);
box-shadow:
inset 0 0 0 2px
rgba(255,255,255,.95),
0 0 14px
rgba(255,255,255,.30);
}
.chart.selection-mode .bar\:not(.four-hour-selected)\:not(.single-hour-selected) {
opacity: .38;
}
.chart.selection-mode .bar.four-hour-selected,
.chart.selection-mode .bar.single-hour-selected {
opacity: 1;
}
/* =========================================================
   PRISBOKS
   ========================================================= */
.selected-price {
position: absolute;
min-width: 52px;
padding: 5px 7px;
border-radius: 8px;
background: rgba(8,18,32,.97);
border: 1px solid rgba(255,255,255,.16);
box-shadow:
0 5px 16px
rgba(0,0,0,.35);
color: white;
font-size: 10px;
line-height: 1.2;
font-weight: 750;
font-variant-numeric: tabular-nums;
white-space: nowrap;
text-align: center;
pointer-events: none;
z-index: 200;
}
.selected-price .price-hour {
display: block;
font-size: 10px;
font-weight: 600;
color: #d5deea;
}
.selected-price .price-value {
display: block;
margin-top: 2px;
font-size: 11px;
font-weight: 800;
color: #ffffff;
}
.positive-price,
.negative-price {
transform:
translateX(-50%)
translateY(-100%);
}
.selected-price::after {
content: "";
position: absolute;
left: 50%;
width: 7px;
height: 7px;
transform:
translateX(-50%)
rotate(45deg);
background: rgba(8,18,32,.97);
bottom: -4px;
border-right: 1px solid rgba(255,255,255,.16);
border-bottom: 1px solid rgba(255,255,255,.16);
}
/* =========================================================
   X-AKSE
   ========================================================= */
.axis {
display: flex;
justify-content: space-between;
padding-top: 8px;
color: #f1f5f9;
font-size: 9px;
font-weight: 600;
}
/* =========================================================
   STATISTIK
   ========================================================= */
.stats {
display: grid;
grid-template-columns:
76px
76px
minmax(0, 1fr);
gap: 7px;
margin-top: 15px;
}
.stat {
min-width: 0;
padding: 12px 8px;
border-radius: 14px;
background: #16243a;
cursor: pointer;
transition:
background .18s ease,
border-color .18s ease,
box-shadow .18s ease,
transform .12s ease;
}
.stat\:active {
transform: scale(.985);
}
.stat-label {
font-size: 10px;
color: #f2f5fa;
line-height: 1.15;
white-space: nowrap;
}
.stat-value {
margin-top: 5px;
font-size: 13px;
font-weight: 700;
line-height: 1.2;
font-variant-numeric: tabular-nums;
white-space: nowrap;
}
/* =========================================================
   FARVER
   ========================================================= */
.stat.price-negative {
background: rgba(192,132,252,.42);
border: 1px solid rgba(192,132,252,.38);
}
.stat.price-blue {
background: rgba(96,165,250,.42);
border: 1px solid rgba(96,165,250,.38);
}
.stat.price-cheap {
background: rgba(110,231,183,.42);
border: 1px solid rgba(110,231,183,.38);
}
.stat.price-warning {
background: rgba(251,191,36,.42);
border: 1px solid rgba(251,191,36,.38);
}
.stat.price-expensive {
background: rgba(251,113,133,.42);
border: 1px solid rgba(251,113,133,.38);
}
.stat.kwh-red {
background: rgba(251,113,133,.42);
border: 1px solid rgba(251,113,133,.38);
}
.stat.kwh-yellow {
background: rgba(251,191,36,.42);
border: 1px solid rgba(251,191,36,.38);
}
.stat.kwh-green {
background: rgba(110,231,183,.42);
border: 1px solid rgba(110,231,183,.38);
}
.stat.kwh-blue {
background: rgba(96,165,250,.42);
border: 1px solid rgba(96,165,250,.38);
}
.stat.kwh-purple {
background: rgba(192,132,252,.42);
border: 1px solid rgba(192,132,252,.38);
}
/* =========================================================
   AKTIV STATISTIK
   ========================================================= */
.stat.selected-stat {
transform: translateY(-2px);
border-color:
rgba(255,255,255,.75);
box-shadow:
inset 0 0 0 1px
rgba(255,255,255,.22),
0 0 0 1px
rgba(255,255,255,.10),
0 5px 16px
rgba(0,0,0,.28);
}
.stat.selected-stat .stat-label {
color: #ffffff;
text-shadow:
0 0 6px
rgba(255,255,255,.25);
}
.stat.selected-stat .stat-value {
color: #ffffff;
}
/* =========================================================
   BILLIGSTE 4 TIMER
   ========================================================= */
.stat-four-hours {
text-align: left;
}
.stat-four-hours .stat-label {
white-space: nowrap;
color: #f2f5fa;
font-size: 10px;
}
.stat-four-hours .stat-value {
font-size: 14px;
white-space: nowrap;
}
/* =========================================================
   KWH / PRIS I ALT / TV 2
   ========================================================= */
.kwh-stat {
grid-column: 1 / -1;
display: grid;
grid-template-columns:
minmax(0, 1fr)
minmax(0, 1fr)
minmax(0, 1fr);
column-gap: 8px;
row-gap: 0;
margin-top: 0;
padding: 12px 8px;
}
.kpi-column {
min-width: 0;
text-align: center;
}
.kpi-label {
height: 14px;
display: flex;
align-items: center;
justify-content: center;
font-size: 10px;
font-weight: 650;
line-height: 14px;
color: #f2f5fa;
white-space: nowrap;
}
.kpi-value {
height: 22px;
display: flex;
align-items: center;
justify-content: center;
margin-top: 5px;
font-size: 15px;
font-weight: 800;
line-height: 22px;
font-variant-numeric: tabular-nums;
white-space: nowrap;
}
.kpi-subtext {
height: 12px;
display: flex;
align-items: center;
justify-content: center;
margin-top: 3px;
font-size: 9px;
font-weight: 600;
line-height: 12px;
color: rgba(255,255,255,.62);
white-space: nowrap;
}
.kpi-subtext.placeholder {
visibility: hidden;
}
/* =========================================================
   FARVEFORKLARING
   ========================================================= */
.color-legend {
display: flex;
align-items: center;
justify-content: space-between;
gap: 6px;
margin-top: 9px;
padding: 8px 7px;
border-radius: 10px;
background: rgba(255,255,255,.035);
border: 1px solid rgba(255,255,255,.06);
}
.legend-item {
display: flex;
align-items: center;
gap: 5px;
min-width: 0;
color: rgba(255,255,255,.82);
font-size: 9px;
font-weight: 650;
line-height: 1;
white-space: nowrap;
}
.legend-dot {
width: 10px;
height: 10px;
flex: 0 0 10px;
border-radius: 50%;
box-shadow:
0 0 0 1px
rgba(255,255,255,.12);
}
.legend-red {
background: #fb7185;
}
.legend-yellow {
background: #fbbf24;
}
.legend-green {
background: #6ee7b7;
}
.legend-blue {
background: #60a5fa;
}
.legend-purple {
background: #c084fc;
}
/* =========================================================
   MADE BY MORITZ
   ========================================================= */
.made-by {
margin-top: auto;
padding-top: 28px;
padding-bottom: 4px;
display: flex;
justify-content: center;
align-items: center;
color: #5f6d80;
font-size: 10px;
font-weight: 600;
letter-spacing: .2px;
white-space: nowrap;
overflow: hidden;
}
.made-by span {
display: inline-block;
opacity: 0;
filter: blur(2px);
animation:
madeByFade 0.38s ease forwards;
}
@keyframes madeByFade {
0% {
opacity: 0;
filter: blur(2px);
transform: translateY(2px);
}
100% {
opacity: 1;
filter: blur(0);
transform: translateY(0);
}
}
/* =========================================================
   SMÅ TELEFONER
   ========================================================= */
@media (max-width: 360px) {
.app {
padding-left: 12px;
padding-right: 12px;
}
.logo {
font-size: 15px;
}
.status {
padding-left: 9px;
padding-right: 9px;
}
.data-status {
font-size: 10px;
}
.data-symbol {
font-size: 13px;
}
.stats {
grid-template-columns:
70px
70px
minmax(0, 1fr);
gap: 5px;
}
.stat {
padding-left: 6px;
padding-right: 6px;
}
.stat-value {
font-size: 12px;
}
.stat-four-hours .stat-value {
font-size: 12px;
}
.stat-four-hours .stat-label {
font-size: 9px;
}
.kwh-stat {
column-gap: 4px;
padding-left: 5px;
padding-right: 5px;
}
.kpi-label {
font-size: 9px;
}
.kpi-value {
font-size: 13px;
}
.kpi-subtext {
font-size: 8px;
}
.color-legend {
gap: 3px;
padding-left: 5px;
padding-right: 5px;
}
.legend-item {
gap: 3px;
font-size: 8px;
}
.legend-dot {
width: 9px;
height: 9px;
flex-basis: 9px;
}
.made-by {
font-size: 9px;
}
}
</style>
</head>
<body>

<script>
const API_BASE =
"https\://elpriser.org/api";
const PRICES_API =
"https\://moritz-elpris.jonas-9d6.workers.dev/prices";
const API_MODE =
"spot_inkl";
const API_AREA =
"DK1";
const MAX_DAYS_FORWARD =
6;
const DATA_REFRESH_MS =
10000;
/* =========================================================
   DATA TIMESTAMP
   ========================================================= */
function updateDataStatus(
success,
updated
) {
const symbol =
document.getElementById(
"dataSymbol"
);
const timestamp =
document.getElementById(
"dataTimestamp"
);
if (!symbol || !timestamp) {
return;
}
symbol.classList.remove(
"data-ok",
"data-error"
);
if (success) {
if (updated) {
const match =
String(updated).match(
/(\d{2}):(\d{2}):(\d{2})$/
);
if (match) {
timestamp.textContent =
match[1] +
"." +
match[2] +
"." +
match[3];
}
else {
timestamp.textContent =
"Data mangler";

async function loadTariffsForDate(

if (cached && cached.length === 24) return cached;
/* FLOW Elnet C-kunde, sommer (april-september), ekskl. moms.
   00-06 Lavlast   6,61 øre
   06-17 Højlast   9,91 øre
   17-21 Spidslast 25,77 øre
   21-24 Højlast   9,91 øre
*/
const month = new Date(date + "T12:00:00").getMonth() + 1;
if (month >= 4 && month <= 9) {
const LOW = 6.61;
const HIGH = 9.91;
const PEAK = 25.77;
const tariffs = Array.from({length: 24}, (_, hour) => {
if (hour < 6) return LOW;
if (hour < 17) return HIGH;
if (hour < 21) return PEAK;
return HIGH;
});
tariffCache.set(date, tariffs);
return tariffs;
}
return [];
}

/* =========================================================
   SKALA
   ========================================================= */
function getScale() {
const allPrices =
apiDays.flatMap(
day =>
extractGraphPrices(day)
);
const validPrices =
allPrices.filter(
value =>
Number.isFinite(value)
);
const minimum =
validPrices.length
? Math.min(...validPrices)
: 0;
const maximum =
validPrices.length
? Math.max(...validPrices)
: 25;
const negative =
minimum < 0
? Math.max(
25,
Math.ceil(
Math.abs(minimum) / 25
) * 25
)
: 0;
const positive =
Math.max(
25,
Math.ceil(
maximum / 25
) * 25
);
return {
minimum,
maximum,
negative,
positive,
total:
negative +
positive
};
}

function findCheapestFourHours(
prices
) {
let bestStart = 0;
let bestTotal = Infinity;
for (
let start = 0;
start <= prices.length - 4;
start++
) {
const total =
prices[start] +
prices[start + 1] +
prices[start + 2] +
prices[start + 3];
if (
total < bestTotal
) {
bestTotal =
total;
bestStart =
start;
}
}
return {
start: bestStart,
end: bestStart + 4,
average:
bestTotal / 4
};
}

/* =========================================================
   PRISBEREGNING
   ========================================================= */
function getQualifyingHours(
prices
) {
const hours = [];
prices.forEach(
(price, hour) => {
if (
price <= 25
) {
hours.push(hour);
}
});
return hours;
}
function getHourTotalPrice(
prices,
rawTariffs,
hour
) {
if (
!Array.isArray(
prices
) ||
!Number.isFinite(
prices[hour]
)
) {
return null;
}
if (
!Array.isArray(
rawTariffs
) ||
!Number.isFinite(
rawTariffs[hour]
)
) {
return null;
}
/*
 * /prices leverer net_inkl_alt i ØRE.
 *
 * Grafen viser beløbet direkte i øre.
 * Til kroner-beregningen konverteres det her til kr.
 */
const priceFromPrices =
prices[hour] / 100;
const tariffInclVat =
rawTariffs[hour] *
VAT;
const supplierSurcharge =
SUPPLIER_SURCHARGE_INCL_VAT;
return (
priceFromPrices +
tariffInclVat +
supplierSurcharge
);
}
/* =========================================================
   PRIS I ALT
   ========================================================= */
function calculateTotalPrice(
    spotPrices,
    rawTariffs
) {
    const hours =
        getQualifyingHours(
            spotPrices
        );
    if (
        hours.length === 0
    ) {
        return null;
    }
    let total = 0;
    for (
        const hour of hours
    ) {
        if (
            !Number.isFinite(
                spotPrices[hour]
            ) ||
            !Number.isFinite(
                rawTariffs?.[hour]
            )
        ) {
            return null;
        }
        /*
         * /prices indeholder net_inkl_alt i ØRE.
         *
         * Ingen ×100 og ingen brug af forecastInclAlt.
         */
        const priceFromPrices =
            spotPrices[hour];
        /*
         * /raw/tariff returnerer FLOW-tariffen
         * i ØRE ekskl. moms.
         */
        const tariffInclVat =
            rawTariffs[hour] *
            VAT;
        /*
         * 2,5 øre inkl. moms.
         */
        const supplierSurchargeOre =
            2.5;
        /*
         * Alt er nu i ØRE.
         */
        const totalOre =
            priceFromPrices +
            tariffInclVat +
            supplierSurchargeOre;
        /*
         * ØRE -> KRONER, og derefter 11 kWh.
         */
        total +=
            (totalOre / 100) *
            11;
    }
    return total;
}
/* =========================================================
   TV 2
   ========================================================= */
function calculateTv2Cost(
    spotPrices,
    rawTariffs
) {
    const hours =
        getQualifyingHours(
            spotPrices
        );
    if (
        hours.length < 2
    ) {
        return null;
    }
    let sum = 0;
    for (
        const hour of hours
    ) {
        if (
            !Number.isFinite(
                spotPrices[hour]
            ) ||
            !Number.isFinite(
                rawTariffs?.[hour]
            )
        ) {
            return null;
        }
        /*
         * Samme timer som PRIS I ALT:
         * alle timer hvor /prices <= 25 øre.
         *
         * /prices er allerede net_inkl_alt
         * i øre.
         */
        const priceFromPrices =
            spotPrices[hour];
        /*
         * FLOW-tariffen er i øre ekskl. moms.
         */
        const tariffInclVat =
            rawTariffs[hour] *
            VAT;
        /*
         * 2,5 øre/kWh inkl. moms.
         */
        const supplierSurchargeOre =
            2.5;
        /*
         * Samlet pris for den enkelte time
         * i øre/kWh.
         */
        const totalOre =
            priceFromPrices +
            tariffInclVat +
            supplierSurchargeOre;
        sum +=
            totalOre;
    }
    /*
     * Gennemsnit af de samme timer.
     */
    const averageOre =
        sum /
        hours.length;
    /*
     * TV 2 kører 17 kWh.
     */
    return (
        averageOre /
        100 *
        17
    );
}
/* =========================================================
   HENT OG BEREGN EN DAG
   ========================================================= */
async function calculateDayTariffData(
day
) {
if (
!day ||
!day.date
) {

}
const spotPrices =
extractDayPrices(day);
if (
spotPrices.length !== 24
) {

await loadTariffsForDate(
day.date
);

rawTariffs.length !== 24
) {

"Rå tariff mangler 24 priser for:",
day.date,
rawTariffs
);
return null;
}
const qualifyingHours =
getQualifyingHours(
spotPrices
);
const totalCost =
calculateTotalPrice(
spotPrices,
rawTariffs
);
const tv2Cost =
calculateTv2Cost(
spotPrices,
rawTariffs
);
return {
date: day.date,
qualifyingHours,
kwh:
qualifyingHours.length * 11,
totalCost,
tv2Cost
};
}

)

   ========================================================= */

document.getElementById(
"chartDate"
);

if (!day) {

}

"T12:00:00"
);

activeDayIndex === 0
) {

"Timepriser";
}

activeDayIndex === 1
) {

title.innerHTML =
"Timepriser i morgen";

else {

'Timepriser i morgen ' +
'<span class="forecast-text">' +
'(Prognose)' +
'</span>';
}
}
else {
const weekday =
selectedDate.toLocaleDateString(
"da-DK",
{
weekday: "long"
}
);
if (actual) {
title.innerHTML =
"Timepriser " +
weekday;
}
else {
title.innerHTML =
"Timepriser " +
weekday +
' <span class="forecast-text">' +
'(Prognose)' +
'</span>';
}
}
date.textContent =
selectedDate.toLocaleDateString(
"da-DK",
{
day: "numeric",
month: "long"
}
);
}
/* =========================================================
   MARKERING
   ========================================================= */
function applySelection() {
const chart =
document.getElementById(
"chart"
);
const bars =
chart.querySelectorAll(
".bar"
);
bars.forEach(
bar => {
bar.classList.remove(
"four-hour-selected",
"single-hour-selected"
);
}
);
chart.classList.remove(
"selection-mode"
);
if (
selectionMode === null
) {
return;
}
chart.classList.add(
"selection-mode"
);
const prices =
extractGraphPrices(
getSelectedDay()
);
if (
selectionMode === "min"
) {
const min =
Math.min(...prices);
const index =
prices.indexOf(min);
if (bars[index]) {
bars[index].classList.add(
"single-hour-selected"
);
}
}
if (
selectionMode === "max"
) {
const max =
Math.max(...prices);
const index =
prices.indexOf(max);
if (bars[index]) {
bars[index].classList.add(
"single-hour-selected"
);
}
}
if (
selectionMode === "four"
) {
const cheapest =
findCheapestFourHours(
prices
);
for (
let hour =
cheapest.start;
hour <
cheapest.end;
hour++
) {
if (bars[hour]) {
bars[hour].classList.add(
"four-hour-selected"
);
}
}
}
if (
selectionMode === "kwh"
) {
prices.forEach(
(price, hour) => {
if (
price <= 25 &&
bars[hour]
) {
bars[hour].classList.add(
"four-hour-selected"
);
}
}
);
}
}

/* =========================================================
   POINTER / TOUCH
   ========================================================= */
let activePointer =
false;
let lastTouchedHour =
null;
function getHourFromPointer(
event
) {
const chart =
document.getElementById(
"chart"
);
const rect =
chart.getBoundingClientRect();
const x =
event.clientX -
rect.left;
const clampedX =
Math.max(
0,
Math.min(
rect.width,
x
)
);
const hour =
Math.floor(
clampedX /
rect.width *
24
);
return Math.max(
0,
Math.min(
23,
hour
)
);
}
function selectHour(hour) {
const prices =
extractGraphPrices(
getSelectedDay()
);
const bars =
document.querySelectorAll(
".bar"
);
const selectedBar =
bars[hour];
if (!selectedBar) {
return;
}
selectionMode =
null;
updateSelectedStat();
document
.getElementById(
"chart"
)
.classList.remove(
"selection-mode"
);
bars.forEach(
bar => {
bar.classList.remove(
"four-hour-selected",
"single-hour-selected"
);
}
);
showPrice(
hour,
prices[hour],
selectedBar
);
}
function showPrice(
hour,
price,
selectedBar
) {
document
.querySelectorAll(
".selected-price"
)
.forEach(
label => {
label.remove();
}
);
selectedBar.classList.add(
"single-hour-selected"
);
const label =
document.createElement(
"div"
);
label.className =
"selected-price";
label.innerHTML = `
<span class="price-hour">
${formatHour(hour)}
</span>
<span class="price-value">
${formatStatPrice(price)}
</span>
`;
if (
price >= 0
) {
label.classList.add(
"positive-price"
);
selectedBar.appendChild(
label
);
}
else {
label.classList.add(
"negative-price"
);
const scale =
getScale();
label.style.left =
(
(hour + 0.5) /
24 *
100
) + "%";
label.style.top =
(
100 -
(
scale.negative /
scale.total *
100
)
) + "%";
document
.getElementById(
"chart"
)
.appendChild(
label
);
}
lastTouchedHour =
hour;
}
const chartElement =
document.getElementById(
"chart"
);
chartElement.addEventListener(
"pointerdown",
function(event) {
activePointer =
true;
event.preventDefault();
const hour =
getHourFromPointer(
event
);
selectHour(hour);
try {
chartElement.setPointerCapture(
event.pointerId
);
}
catch (error) {}
},
{
passive: false
}
);
chartElement.addEventListener(
"pointermove",
function(event) {
if (!activePointer) {
return;
}
event.preventDefault();
const hour =
getHourFromPointer(
event
);
if (
hour !==
lastTouchedHour
) {
selectHour(hour);
}
},
{
passive: false
}
);
function finishPointer(
event
) {
if (!activePointer) {
return;
}
activePointer =
false;
try {
chartElement.releasePointerCapture(
event.pointerId
);
}
catch (error) {}
}
chartElement.addEventListener(
"pointerup",
finishPointer
);
chartElement.addEventListener(
"pointercancel",
finishPointer
);
function clearSelection() {
document
.querySelectorAll(
".selected-price"
)
.forEach(
label => {
label.remove();
}
);
lastTouchedHour =
null;
}

/* =========================================================
   FEJL
   ========================================================= */
function showLoadError(
message
) {
const chart =
document.getElementById(
"chart"
);
chart.innerHTML = "";
const error =
document.createElement(
"div"
);
error.style.position =
"absolute";
error.style.left =
"50%";
error.style.top =
"50%";
error.style.transform =
"translate(-50%, -50%)";
error.style.color =
"#8392a8";
error.style.fontSize =
"11px";
error.style.textAlign =
"center";
error.textContent =
message;

error
);
}

/* =========================================================
   LIVE DATA OPDATERING
   ========================================================= */
async function refreshLiveData() {
if (
dataRefreshInProgress
) {
return;
}
dataRefreshInProgress =
true;
try {
const newDays =
await loadForecastData();
const newToday =
await loadTodayPrices();
if (newDays[0]) {
newDays[0] = {
...newDays[0],
...newToday
};
}
else {
newDays.unshift(newToday);
}
if (
newToday.tomorrow &&
Array.isArray(newToday.tomorrow.prices) &&
newToday.tomorrow.prices.length === 24
) {
const tomorrowIndex =
newDays.findIndex(
day =>
day &&
day.date === newToday.tomorrow.date
);
if (tomorrowIndex !== -1) {
newDays[tomorrowIndex] = {
...newDays[tomorrowIndex],
...newToday.tomorrow
};
}
}
const newTariffForecastDays =
await loadTariffForecastData();
const newDataSignature =
createDataSignature(
newDays
);
const newSelectedDay =
newDays[
activeDayIndex
];
const newSelectedDaySignature =
createDaySignature(
newSelectedDay
);
const dataChanged =
newDataSignature !==
lastDataSignature;
const selectedDayChanged =
newSelectedDaySignature !==
lastSelectedDaySignature;
const newHour =
new Date().getHours();
const hourChanged =
newHour !==
lastKnownHour;
apiDays =
newDays;
tariffForecastDays =
newTariffForecastDays;
currentHour =
newHour;
if (
activeDayIndex >
MAX_DAYS_FORWARD
) {
activeDayIndex =
MAX_DAYS_FORWARD;
}
const todayPrices =
extractDayPrices(
apiDays[0]
);
let newCurrentPrice =
currentPrice;
if (
todayPrices.length === 24
) {
newCurrentPrice =
todayPrices[
currentHour
];
}
const currentPriceChanged =
newCurrentPrice !==
currentPrice;
currentPrice =
newCurrentPrice;
lastDataSignature =
newDataSignature;
lastSelectedDaySignature =
createDaySignature(
apiDays[
activeDayIndex
]
);
lastKnownHour =
newHour;
if (
dataChanged
) {
apiDays.forEach(
day => {
if (day) {
delete day._tariffCalculation;
}
});
}
updateDataStatus(
true,
newToday.updated
);
if (
selectedDayChanged
) {
render();
}
else if (
hourChanged
) {
updateInformation();
updateCurrentHourVisual();
updateDisplayedTariffInformation();
await calculateAllSevenDays();
}
else if (
currentPriceChanged
) {
updateInformation();
}
if (
dataChanged
) {
updateDayButtons();
await calculateAllSevenDays();
}
}
catch (error) {
console.error(
"Live data refresh fejl:",
error
);
updateDataStatus(false);
}
finally {
dataRefreshInProgress =
false;
}
}
/* =========================================================
   START LIVE DATA REFRESH
   ========================================================= */
function startDataRefresh() {
if (
dataRefreshTimer
) {
clearInterval(
dataRefreshTimer
);
}
dataRefreshTimer =
setInterval(
refreshLiveData,
DATA_REFRESH_MS
);
}
/* =========================================================
   START
   ========================================================= */
async function initialize() {
try {
apiDays =
await loadForecastData();
const todayData =
await loadTodayPrices();
if (apiDays[0]) {
apiDays[0] = {
...apiDays[0],
...todayData
};
}
else {
apiDays.unshift(todayData);
}
if (
todayData.tomorrow &&
Array.isArray(todayData.tomorrow.prices) &&
todayData.tomorrow.prices.length === 24
) {
const tomorrowIndex =
apiDays.findIndex(
day =>
day &&
day.date === todayData.tomorrow.date
);
if (tomorrowIndex !== -1) {
apiDays[tomorrowIndex] = {
...apiDays[tomorrowIndex],
...todayData.tomorrow
};
}
}
tariffForecastDays =
await loadTariffForecastData();
currentHour =
new Date()
.getHours();
lastKnownHour =
currentHour;
const todayPrices =
extractDayPrices(
apiDays[0]
);
if (
todayPrices.length === 24
) {
currentPrice =
todayPrices[
currentHour
];
}
lastDataSignature =
createDataSignature(
apiDays
);
lastSelectedDaySignature =
createDaySignature(
apiDays[
activeDayIndex
]
);
updateDataStatus(
true,
todayData.updated
);
render();
startDataRefresh();
}
catch (error) {
console.error(
error
);
updateDataStatus(false);
showLoadError(
"Kunne ikke hente elpriser"
);
startDataRefresh();
}
}
initialize();
